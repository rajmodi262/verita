# Phase 7 (Containerization) + Phase 8 (local deploy) + Phase 9 (Monitoring)
# Five real services — postgres, backend, frontend, prometheus, grafana. No dead bloat.
services:
  postgres:
    image: postgres:16-alpine
    container_name: verita-postgres
    environment:
      POSTGRES_USER: verita
      POSTGRES_PASSWORD: verita
      POSTGRES_DB: verita
    ports:
      - "5433:5432"  # host 5433 to avoid clashing with any local Postgres on 5432
    volumes:
      - verita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verita -d verita"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: verita-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://verita:verita@postgres:5432/verita
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: verita-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: verita-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: verita-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=verita
    depends_on:
      - prometheus

volumes:
  verita_pgdata:
