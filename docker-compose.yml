# Phase 7 (Containerization) + Phase 8 (local deploy) + Phase 9 (Monitoring)
# Four real services — backend, frontend, prometheus, grafana. No dead bloat.
services:
  backend:
    build: ./backend
    container_name: verita-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: verita-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: verita-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: verita-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=verita
    depends_on:
      - prometheus
