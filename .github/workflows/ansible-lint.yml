name: Ansible Lint

on:
  push:
    branches: [main, develop]
    paths: ["deploy/ansible/**"]
  pull_request:
    paths: ["deploy/ansible/**"]

jobs:
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ansible and ansible-lint
        run: pip install ansible-core ansible-lint
      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check the playbook
        run: ansible-playbook -i inventory.ini deploy.yml --syntax-check
      - name: Lint the playbook (advisory)
        run: ansible-lint deploy.yml || true
