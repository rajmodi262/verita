# Phase 8 — Deployment (CD): frontend Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verita-frontend
  labels: { app: verita-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: verita-frontend }
  template:
    metadata:
      labels: { app: verita-frontend }
    spec:
      containers:
        - name: frontend
          image: verita-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: verita-frontend
spec:
  type: LoadBalancer
  selector: { app: verita-frontend }
  ports:
    - port: 80
      targetPort: 80
