# Verita deployment inventory.
# Replace ansible_host / ansible_user with your target server's details.

[verita]
verita-prod ansible_host=203.0.113.10 ansible_user=ubuntu

[verita:vars]
ansible_python_interpreter=/usr/bin/python3
app_dir=/opt/verita
repo_url=https://github.com/rajmodi262/verita.git
repo_version=main
