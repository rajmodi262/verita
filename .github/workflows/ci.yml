name: Verita CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Static analysis + security scanning ──────────────────────────
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff — hard gate (syntax errors + undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Ruff — full lint (advisory)
        run: ruff check . || true
      - name: Ruff — format check (advisory)
        run: ruff format --check . || true
      - name: Bandit (security static analysis, advisory)
        run: bandit -r app -q || true
      - name: pip-audit (dependency vulnerability scan, advisory)
        run: pip-audit -r requirements.txt || true

  # ── Backend tests with coverage gate ─────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage (fail under 70%)
        run: python -m pytest --cov-fail-under=70
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Frontend: type-check, test and build ─────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Type-check + build
        run: npm run build

  # ── Verify the container images build ────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t verita-backend ./backend
      - name: Build frontend image
        run: docker build -t verita-frontend ./frontend
